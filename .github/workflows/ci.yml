name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary development machine; Linux is what CI and the
        # container use. The pthread and SDL2 paths differ between them, so both
        # are built rather than assumed equivalent.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev clang-format

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2

      - name: Layering rules and generated-code freshness
        run: |
          python3 tools/ci/lint_layers.py
          python3 tools/schema/gen.py --check

      - name: Companion daemon
        run: ./tools/build.sh rust

      # Linux only, deliberately. Formatting is not platform-dependent, but
      # clang-format is: the macOS runner's build is several major versions
      # ahead of the one apt ships, and the two disagree about where a line
      # break belongs in a macro whose comment contains an em-dash — they count
      # the column in bytes and in characters respectively. Checking the same
      # files twice with two different formatters cannot pass, and the one it
      # has to agree with is the one contributors get from the repo's own
      # tooling.
      - name: Formatting
        if: runner.os == 'Linux'
        run: ./tools/build.sh format-check

      - name: Unit tests
        run: ./tools/build.sh test

      - name: Simulator — headless render
        run: ./tools/build.sh headless 90 build/shot

      - name: Sanitizers
        run: ./tools/build.sh asan

      - name: Simulator — SDL2 build
        run: |
          cmake -S targets/host -B build/host -GNinja -DNEVOS_DISPLAY=sdl2
          cmake --build build/host

      - uses: actions/upload-artifact@v4
        with:
          name: framebuffer-${{ matrix.os }}
          path: build/shot.png

  e2e:
    # The device against a real daemon. Separate from the matrix above because
    # it needs both toolchains and runs a wall-clock minute — and because when
    # it fails, the thing that broke is integration, not any one unit.
    name: device + daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev

      - name: Pair, converse, record a meeting, purge it
        run: ./tools/build.sh e2e

      - name: Keep the logs when it fails
        if: failure()
        run: |
          echo "Re-run locally with: NEVOS_E2E_KEEP=1 ./tools/build.sh e2e"

  device:
    name: esp32s3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # `size` as well as `build`, because the application's flash footprint is
      # the one number in BUDGET.md that cannot be measured on a host at all —
      # it needs this toolchain. Printing it on every push is what stops it
      # drifting towards the 5 MB OTA slot unnoticed.
      - name: Build with ESP-IDF v5.2.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.2
          target: esp32s3
          path: targets/esp32s3
          command: idf.py build size
